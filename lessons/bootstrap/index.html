<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="./bootstrap/css/bootstrap.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        .element {
            width: 300px;
            height: 300px;
        }
    </style>
</head>

<body>
    <!-- color -->
    <!-- text-primary,secondary,success,danger,info,warning,dark,light -->
    <h1 class="text-primary">this is some heading</h1>
    <h1 class="text-secondary">this is some heading</h1>
    <h1 class="text-success">this is some heading</h1>
    <h1 class="text-danger">this is some heading</h1>
    <h1 class="text-info">this is some heading</h1>
    <h1 class="text-warning">this is some heading</h1>
    <h1 class="text-dark">this is some heading</h1>
    <h1 class="text-light">this is some heading</h1>

    <!-- bg -->
    <!-- bg-primary,secondary,success,danger,info,warning,dark,light -->
    <div class="element bg-primary"></div>
    <div class="element bg-secondary"></div>
    <div class="element bg-success"></div>
    <div class="element bg-info"></div>
    <div class="element bg-danger"></div>
    <div class="element bg-warning"></div>
    <div class="element bg-light"></div>
    <div class="element bg-dark"></div>

    <!-- border -->
    <!-- border-0/1/2/3/4/5 -->
    <!-- border-color -->
    <!-- 0-> 0rem, 1-> 0.25rem, 2-> 0.5rem, 3-> .75rem, 4-> 1rem, 5-> 1.25rem -->
    <div class="element bg-light border border-5 border-warning"></div>

    <!-- display -->
    <!-- d-none/block/inline/inline-block/flex -->
    <div class="element bg-warning border border-5 border-warning d-inline-block">
        code
    </div>

</body>

</html>
